name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: stockapp_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stockapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm check

      - name: Verify migration generation is reproducible
        run: |
          pnpm --filter @stock-app/api db:generate
          test -z "$(git status --porcelain -- apps/api/drizzle)"

      - name: Verify official Better Auth schema
        run: |
          pnpm --filter @stock-app/api auth:generate
          test -z "$(git status --porcelain -- apps/api/src/infrastructure/postgres/auth-schema.ts)"
          pnpm --filter @stock-app/api auth:check

      - name: Test PostgreSQL migrations, auth, ownership, security and compiled HTTP with local SMTP
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/stockapp_test
        run: pnpm test:db
